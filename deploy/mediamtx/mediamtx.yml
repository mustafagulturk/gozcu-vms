# Gözcü VMS – sahte IP kamera sunucusu.
# Her path bir kamerayı temsil eder: samples/videos/<path>.mp4 varsa döngüde yayınlanır,
# yoksa test deseni üretilir. Böylece sistem ve CI gerçek kamera olmadan çalışır.

logLevel: info

api: true
apiAddress: :9997

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: false
srt: false

# Tarayıcıda canlı izleme (http://localhost:8888/cam1/ veya web paneldeki hls.js oynatıcı).
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: mpegts
hlsSegmentCount: 6
hlsSegmentDuration: 1s

# İleride düşük gecikmeli izleme için.
webrtc: true
webrtcAddress: :8889

# Her path bir sahte kamera. samples/videos/<path>.mp4 varsa o yayınlanır; yoksa yanındaki test deseni.
# Yeni kamera eklemek için buraya bir path, docker-compose.yml'deki x-cameras listesine de bir kayıt ekleyin.
paths:
  cam1:
    runOnInit: sh /fake-camera.sh testsrc 1280x720 25
    runOnInitRestart: yes
  cam2:
    runOnInit: sh /fake-camera.sh testsrc2 1280x720 25
    runOnInitRestart: yes
  cam3:
    runOnInit: sh /fake-camera.sh testsrc 960x540 15
    runOnInitRestart: yes
  cam4:
    runOnInit: sh /fake-camera.sh life 640x360 25
    runOnInitRestart: yes
