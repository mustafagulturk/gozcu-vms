name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Derleme ve testler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: YOLOX modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: models
          key: model-yolox_tiny-${{ hashFiles('scripts/download-model.sh') }}

      - name: YOLOX modelini indir (SHA-256 doğrulamalı)
        run: ./scripts/download-model.sh yolox_tiny

      - name: Bağımlılıkları geri yükle
        run: dotnet restore

      - name: Derle
        run: dotnet build -c Release --no-restore

      - name: Birim testleri
        run: >
          dotnet test tests/Gozcu.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Entegrasyon testleri (MediaMTX, PostgreSQL, RabbitMQ konteynerleri)
        run: >
          dotnet test tests/Gozcu.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  compose-smoke:
    name: Docker Compose duman testi
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 20
    env:
      SEGMENT_SECONDS: 10
    steps:
      - uses: actions/checkout@v4

      - name: Örnek güvenlik kamerası videolarını indir (insan ve araç tespiti için)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          ./scripts/download-sample-videos.sh

      - name: İmajları derle
        run: docker compose build

      - name: Sistemi başlat
        run: docker compose up -d

      - name: Uçtan uca doğrula
        run: ./scripts/smoke-test.sh

      - name: Servis günlükleri
        if: failure()
        run: docker compose logs --no-color

      - name: Kapat
        if: always()
        run: docker compose down -v
