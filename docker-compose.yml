# Gözcü VMS – tüm sistemi tek komutla başlatır:  docker compose up --build
name: gozcu-vms

# Kamera tohumu: yalnızca akış servisi okur ve cameras tablosu BOŞSA bir kez yazar. Sonrasında kameralar
# web panelinden (http://localhost:5000/cameras.html) ya da /api/cameras üzerinden yönetilir.
x-cameras: &cameras
  Cameras__0__Id: cam1
  Cameras__0__Name: Otopark Girişi
  Cameras__0__RtspUrl: rtsp://mediamtx:8554/cam1
  Cameras__1__Id: cam2
  Cameras__1__Name: Otopark Alanı
  Cameras__1__RtspUrl: rtsp://mediamtx:8554/cam2
  Cameras__2__Id: cam3
  Cameras__2__Name: Koridor
  Cameras__2__RtspUrl: rtsp://mediamtx:8554/cam3
  Cameras__3__Id: cam4
  Cameras__3__Name: Lobi
  Cameras__3__RtspUrl: rtsp://mediamtx:8554/cam4

x-backend: &backend
  ConnectionStrings__Gozcu: Host=postgres;Port=5432;Database=gozcu;Username=gozcu;Password=gozcu
  RabbitMq__ConnectionString: amqp://gozcu:gozcu@rabbitmq:5672/

services:
  # Sahte IP kameralar: samples/videos/*.mp4 dosyalarını RTSP olarak yayınlar.
  mediamtx:
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    restart: unless-stopped
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./deploy/mediamtx/fake-camera.sh:/fake-camera.sh:ro
      - ./samples/videos:/videos:ro
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9997:9997"   # MediaMTX API

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gozcu
      POSTGRES_USER: gozcu
      POSTGRES_PASSWORD: gozcu
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gozcu -d gozcu"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: gozcu
      RABBITMQ_DEFAULT_PASS: gozcu
    ports:
      - "5672:5672"
      - "15672:15672"  # Yönetim arayüzü
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  streaming:
    build:
      context: .
      dockerfile: deploy/service.Dockerfile
      args:
        SERVICE: Gozcu.StreamingService
    image: gozcu/streaming-service:dev
    restart: unless-stopped
    environment:
      <<: [*cameras, *backend]
      RabbitMq__ClientName: gozcu-streaming
      # API yanıtlarındaki mutlak bağlantılar ağ geçidini gösterir; panel sayfaları göreli yol kullanır.
      Streaming__PublicHlsBaseUrl: ${PUBLIC_URL:-http://localhost:5000}/hls/
      Streaming__PublicPlaybackUrl: ${PUBLIC_URL:-http://localhost:5000}/playback.html
    ports:
      - "5080:8080"   # Kamera yönetimi ve durum API'si (tarayıcı ağ geçidini kullanır)
    depends_on:
      mediamtx:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  recording:
    build:
      context: .
      dockerfile: deploy/service.Dockerfile
      args:
        SERVICE: Gozcu.RecordingService
    image: gozcu/recording-service:dev
    restart: unless-stopped
    stop_grace_period: 20s   # ffmpeg'in son parçayı düzgün kapatması için
    environment:
      <<: *backend
      RabbitMq__ClientName: gozcu-recording
      Recording__RootPath: /recordings
      Recording__SegmentSeconds: ${SEGMENT_SECONDS:-60}
      Recording__Retention__MaxTotalBytes: ${RETENTION_MAX_BYTES:-10737418240}
      Recording__Retention__MinFreeBytes: ${RETENTION_MIN_FREE_BYTES:-1073741824}
      Recording__Playback__PublicLiveUrl: ${PUBLIC_URL:-http://localhost:5000}/
    volumes:
      - recordings:/recordings
    ports:
      - "5081:8080"   # Kayıt durumu, arama ve geri oynatma API'si
    depends_on:
      mediamtx:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Tek kod çözen servis: saniyede birkaç kare çözüp YOLOX (ONNX Runtime) ile insan ve araç arar.
  analysis:
    build:
      context: .
      dockerfile: deploy/analysis.Dockerfile
    image: gozcu/analysis-service:dev
    restart: unless-stopped
    environment:
      <<: *backend
      RabbitMq__ClientName: gozcu-analysis
      Analysis__FramesPerSecond: ${ANALYSIS_FPS:-2}
      Analysis__MaxConcurrentInferences: ${ANALYSIS_MAX_CONCURRENCY:-2}
    ports:
      - "5082:8080"   # Analiz durumu, tespit ve olay API'si
    depends_on:
      mediamtx:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Web paneli ve API ağ geçidi (YARP): tarayıcı yalnızca buraya konuşur → http://localhost:5000
  gateway:
    build:
      context: .
      dockerfile: deploy/service.Dockerfile
      args:
        SERVICE: Gozcu.Gateway
    image: gozcu/gateway:dev
    restart: unless-stopped
    environment:
      ReverseProxy__Clusters__streaming__Destinations__default__Address: http://streaming:8080/
      ReverseProxy__Clusters__recording__Destinations__default__Address: http://recording:8080/
      ReverseProxy__Clusters__analysis__Destinations__default__Address: http://analysis:8080/
      ReverseProxy__Clusters__hls__Destinations__default__Address: http://mediamtx:8888/
    ports:
      - "5000:8080"   # Web paneli: canlı, kayıtlar, olaylar, kameralar, analiz
    depends_on:
      - streaming
      - recording
      - analysis
      - mediamtx

volumes:
  pgdata:
  recordings:
